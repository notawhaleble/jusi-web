[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jusi-web"
version = "0.1.0"
description = "Bookmarks, history and Perplexity link discovery for Jusi"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["jusi>=1.0.6,<2", "visidata>=3,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.entry-points."jusi.plugins.v1"]
jusi_web = "jusi_web.catalog:catalog_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/jusi_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
